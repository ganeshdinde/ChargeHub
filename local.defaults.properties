# Fallback value used only when secrets.properties is not present.
# Replace this with a valid Google Maps API key for local builds, or create
# secrets.properties in the project root and set MAPS_API_KEY there.
MAPS_API_KEY=YOUR_GOOGLE_MAPS_API_KEY
# Open Charge Map is used for station locations. Put the real value in the
# ignored secrets.properties file; this intentionally fails loudly otherwise.
OCM_API_KEY=YOUR_OPEN_CHARGE_MAP_API_KEY
# Public HTTPS endpoint of the ChargeHub backend. The backend owns Razorpay
# order creation, signature verification, wallet balances and coupon rules.
CHARGEHUB_BACKEND_URL=YOUR_CHARGEHUB_BACKEND_URL
